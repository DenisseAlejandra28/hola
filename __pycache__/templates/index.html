<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eventos</title>
</head>
<body>
    <h1>Eventos Disponibles</h1>
    <ul>
        {% for event in events %}
            <li>{{ event.name }} - <a href="{{ url_for('register', event_id=event.id) }}">Registrarse</a></li>
        {% endfor %}
    </ul>
</body>
</html>
